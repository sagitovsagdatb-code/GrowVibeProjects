<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трёхдневный Сплит</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F1;
    --surface:#FFFFFF;
    --surface-2:#E3E8E7;
    --text:#14181A;
    --text-muted:#5B6467;
    --border:#D2D8D7;
    --accent-legs:#C4432B;
    --accent-back:#2C5F8A;
    --accent-chest:#C1932A;
    --success:#3F7D53;
    --shadow: 0 1px 2px rgba(20,24,26,0.06), 0 8px 24px -12px rgba(20,24,26,0.18);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171A;
      --surface:#1D2226;
      --surface-2:#262C30;
      --text:#EDEFEE;
      --text-muted:#9AA3A6;
      --border:#333B3F;
      --accent-legs:#E2593C;
      --accent-back:#5B92C4;
      --accent-chest:#E0B24A;
      --success:#5FA876;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171A;
    --surface:#1D2226;
    --surface-2:#262C30;
    --text:#EDEFEE;
    --text-muted:#9AA3A6;
    --border:#333B3F;
    --accent-legs:#E2593C;
    --accent-back:#5B92C4;
    --accent-chest:#E0B24A;
    --success:#5FA876;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
    padding-block:20px 48px;
  }
  .wrap{ max-width:640px; margin:0 auto; }

  h1,h2,h3{ font-family:"Bebas Neue", "IBM Plex Sans", sans-serif; letter-spacing:0.02em; text-wrap:balance; margin:0; }

  .nums{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, [role="checkbox"]:focus-visible, a:focus-visible{
    outline:2px solid var(--accent, var(--text));
    outline-offset:2px;
  }

  /* ---------- Home ---------- */
  .home-header{
    display:flex; flex-direction:column; gap:4px;
    padding-block:8px 22px;
  }
  .eyebrow{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-muted);
  }
  .home-header h1{ font-size:clamp(34px,8vw,44px); line-height:0.95; }

  .day-list{ display:flex; flex-direction:column; gap:14px; }

  .day-card{
    --accent: var(--text);
    display:flex; align-items:stretch; gap:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    overflow:hidden;
    text-align:left;
    width:100%;
    padding:0;
    color:inherit;
    transition:transform .15s ease;
  }
  .day-card:active{ transform:scale(0.99); }
  .day-card[data-day="legs"]{ --accent: var(--accent-legs); }
  .day-card[data-day="back"]{ --accent: var(--accent-back); }
  .day-card[data-day="chest"]{ --accent: var(--accent-chest); }

  .day-card .stripe{ width:8px; flex:none; background:var(--accent); }
  .day-card .body{
    flex:1; display:flex; align-items:center; gap:16px;
    padding:16px 16px 16px 18px;
    min-width:0;
  }
  .day-card .num{
    font-family:"Bebas Neue", sans-serif; font-size:40px; color:var(--accent);
    line-height:1; flex:none; width:52px;
  }
  .day-card .meta{ flex:1; min-width:0; }
  .day-card .meta h2{ font-size:26px; }
  .day-card .meta .sub{ font-size:13px; color:var(--text-muted); margin-top:2px; }
  .day-card .stats{
    flex:none; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .day-card .count{ font-size:13px; color:var(--text-muted); }
  .day-card .mini-bar{
    width:64px; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;
  }
  .day-card .mini-bar > i{ display:block; height:100%; background:var(--accent); border-radius:inherit; }
  .day-card .chev{ color:var(--text-muted); }

  .share-row{ margin-top:26px; display:flex; justify-content:center; }
  .btn-share{
    display:inline-flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:9px 16px; border-radius:99px; font-size:13px; font-weight:500;
  }
  .btn-share:hover{ color:var(--text); border-color:var(--text-muted); }

  /* ---------- Day view ---------- */
  .day-section{ --accent:var(--text); display:none; }
  .day-section.active{ display:block; }
  .day-section[data-day="legs"]{ --accent:var(--accent-legs); }
  .day-section[data-day="back"]{ --accent:var(--accent-back); }
  .day-section[data-day="chest"]{ --accent:var(--accent-chest); }

  .day-topbar{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding-block:10px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .btn-back{
    flex:none; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .day-topbar h2{ font-size:26px; flex:1; min-width:0; }
  .day-topbar .sub{ font-size:12px; color:var(--text-muted); }

  .progress-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px 16px; display:flex; align-items:center; gap:14px; margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .progress-track{ flex:1; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-track > i{ display:block; height:100%; width:0%; background:var(--accent); border-radius:inherit; transition:width .25s ease; }
  .progress-count{ font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:600; flex:none; }
  .btn-reset{
    flex:none; background:transparent; border:1px solid var(--border); color:var(--text-muted);
    font-size:12px; padding:7px 10px; border-radius:99px;
  }
  .btn-reset:hover{ color:var(--text); border-color:var(--text-muted); }

  .banner-done{
    display:none; align-items:center; gap:10px;
    background:color-mix(in srgb, var(--success) 14%, var(--surface));
    border:1px solid color-mix(in srgb, var(--success) 40%, var(--border));
    color:var(--success); border-radius:var(--radius-md);
    padding:12px 14px; margin-bottom:18px; font-weight:600; font-size:14px;
  }
  .banner-done.show{ display:flex; }

  .superset{ margin-bottom:26px; }
  .superset-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:10px; }
  .superset-label{
    font-family:"Bebas Neue",sans-serif; font-size:15px; letter-spacing:0.04em;
    background:var(--accent); color:var(--surface); width:24px; height:24px;
    border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
    flex:none;
  }
  .superset-hint{ font-size:12.5px; color:var(--text-muted); }

  .exercise{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .exercise.done{ opacity:0.62; }
  .ex-head{ display:flex; align-items:flex-start; gap:12px; }
  .ex-icon{
    flex:none; width:44px; height:44px; border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .ex-icon svg{ width:26px; height:26px; }
  .ex-info{ flex:1; min-width:0; }
  .ex-info h3{ font-family:"IBM Plex Sans"; font-size:15.5px; font-weight:600; letter-spacing:0; line-height:1.3; }
  .ex-info .note{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .ex-check{
    flex:none; width:26px; height:26px; border-radius:7px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:transparent; margin-top:2px;
  }
  .ex-check.checked{ background:var(--accent); border-color:var(--accent); color:var(--surface); }
  .ex-check svg{ width:15px; height:15px; }

  table.sets{ width:100%; border-collapse:collapse; margin-top:12px; font-size:13px; }
  table.sets th{
    text-align:left; font-weight:500; color:var(--text-muted); font-size:11px;
    text-transform:uppercase; letter-spacing:0.06em; padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  table.sets td{ padding:7px 4px; border-bottom:1px solid var(--border); }
  table.sets tr:last-child td{ border-bottom:none; }
  table.sets td.n{ color:var(--text-muted); width:20px; }
  table.sets td.w{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-variant-numeric:tabular-nums; }
  table.sets td.r{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  table.sets td.rest{ color:var(--text-muted); font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:99px;
    font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:all .2s ease;
    box-shadow:var(--shadow); white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <section id="home">

      <span class="eyebrow">Программа зала · 3 дня в неделю</span>
      <h1>Трёхдневный Сплит</h1>
    </div>
    <div class="day-list" id="dayList"></div>
    <div class="share-row">
      <button class="btn-share" id="shareBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        Поделиться приложением
      </button>
    </div>
  </section>

  <!-- DAY VIEWS -->
  <div id="dayViews"></div>

</div>

<div class="toast" id="toast"></div>

      id:"back", title:"Спина", num:"День 02", sub:"Среда", day:"back",
      supersets:[
        { label:"A", hint:"Основное упражнение · отдых между подходами 2:00",
          exercises:[
            { name:"Румынская тяга", icon:"rdl", note:"Спина прямая, гриф вдоль голени",
              sets:[{n:1,w:"40",r:"12",rest:"—"},{n:2,w:"60",r:"10",rest:"120с"},{n:3,w:"70",r:"8",rest:"120с"},{n:4,w:"70",r:"8",rest:"120с"}] }
          ]},
        { label:"Б", hint:"Суперсет — без отдыха между упражнениями, 90с после круга",
          exercises:[
            { name:"Тяга штанги в наклоне", icon:"rowbent",
              sets:[{n:1,w:"40",r:"12",rest:"0с"},{n:2,w:"50",r:"10",rest:"0с"},{n:3,w:"50",r:"10",rest:"90с"}] },
            { name:"Тяга верхнего блока", icon:"latpull", note:"Широкий хват, к верху груди",
              sets:[{n:1,w:"50",r:"12",rest:"0с"},{n:2,w:"55",r:"10",rest:"0с"},{n:3,w:"55",r:"10",rest:"90с"}] }
          ]},
        { label:"В", hint:"Суперсет — без отдыха между упражнениями, 60с после круга",
          exercises:[
            { name:"Тяга горизонтального блока", icon:"cablerow", note:"Локти вдоль корпуса",
              sets:[{n:1,w:"45",r:"15",rest:"0с"},{n:2,w:"50",r:"12",rest:"0с"},{n:3,w:"50",r:"12",rest:"60с"}] },
            { name:"Гиперэкстензия", icon:"backext",
              sets:[{n:1,w:"тело",r:"15",rest:"0с"},{n:2,w:"+10",r:"12",rest:"0с"},{n:3,w:"+10",r:"12",rest:"60с"}] }
          ]}
      ]
    },
    {
      id:"chest", title:"Грудь", num:"День 03", sub:"Пятница", day:"chest",
      supersets:[
        { label:"A", hint:"Основное упражнение · отдых между подходами 2:00",
          exercises:[
            { name:"Жим штанги лёжа", icon:"bench",
              sets:[{n:1,w:"40",r:"12",rest:"—"},{n:2,w:"55",r:"10",rest:"120с"},{n:3,w:"65",r:"8",rest:"120с"},{n:4,w:"65",r:"8",rest:"120с"}] }
          ]},
        { label:"Б", hint:"Суперсет — без отдыха между упражнениями, 90с после круга",
          exercises:[
            { name:"Жим гантелей на наклонной", icon:"inclinedb",
              sets:[{n:1,w:"16",r:"12",rest:"0с"},{n:2,w:"18",r:"10",rest:"0с"},{n:3,w:"18",r:"10",rest:"90с"}] },
            { name:"Разведение гантелей лёжа", icon:"fly", note:"Лёгкий вес, акцент на растяжку",
              sets:[{n:1,w:"10",r:"15",rest:"0с"},{n:2,w:"12",r:"12",rest:"0с"},{n:3,w:"12",r:"12",rest:"90с"}] }
          ]},
        { label:"В", hint:"Суперсет — без отдыха между упражнениями, 60с после круга",
          exercises:[
            { name:"Жим гантелей сидя", icon:"shoulderpress",
              sets:[{n:1,w:"14",r:"12",rest:"0с"},{n:2,w:"16",r:"10",rest:"0с"},{n:3,w:"16",r:"10",rest:"60с"}] },
            { name:"Разгибание рук на блоке", icon:"tricepspushdown",
              sets:[{n:1,w:"25",r:"15",rest:"0с"},{n:2,w:"30",r:"12",rest:"0с"},{n:3,w:"30",r:"12",rest:"60с"}] }
          ]}
      ]
    }
  ];

  /* ---------------- Progress storage ---------------- */
  const STORE_KEY = "split-tracker-progress";
  function loadProgress(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
  }
  let progress = loadProgress();

  function dayTotal(day){
    let total = 0;
    day.supersets.forEach(ss => total += ss.exercises.length);
    return total;
  }
  function dayDone(day){
    const p = progress[day.id] || {};
    return Object.values(p).filter(Boolean).length;
  }

  /* ---------------- Render: Home ---------------- */
  const dayList = document.getElementById("dayList");
  function renderHome(){
    dayList.innerHTML = "";
    DAYS.forEach(day => {
      const total = dayTotal(day);
      const done = dayDone(day);
      const pct = total ? Math.round(done/total*100) : 0;
      const card = document.createElement("button");
      card.type = "button";
      card.className = "day-card";
      card.dataset.day = day.day;
      card.setAttribute("aria-label", `${day.title}, ${day.sub}, выполнено ${done} из ${total}`);
      card.innerHTML = `
        <span class="stripe"></span>
        <span class="body">
          <span class="num nums">${day.num.replace("День ","")}</span>
          <span class="meta">
            <h2>${day.title}</h2>
            <div class="sub">${day.sub} · ${total} упражнений</div>
          </span>
          <span class="stats">
            <span class="count nums">${done}/${total}</span>
            <span class="mini-bar"><i style="width:${pct}%"></i></span>
          </span>
          <span class="chev">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </span>`;
      card.addEventListener("click", () => openDay(day.id));
      dayList.appendChild(card);
    });
  }

  /* ---------------- Render: Day views ---------------- */
  const dayViews = document.getElementById("dayViews");
  function buildDaySection(day){
    const section = document.createElement("section");
    section.className = "day-section";
    section.id = "day-" + day.id;
    section.dataset.day = day.day;

    const topbar = document.createElement("div");
    topbar.className = "day-topbar";
    topbar.innerHTML = `
      <button class="btn-back" type="button" aria-label="Назад к списку дней">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
      </button>
      <div>
        <h2>${day.title}</h2>
        <div class="sub">${day.num} · ${day.sub}</div>
      </div>`;
    topbar.querySelector(".btn-back").addEventListener("click", goHome);
    section.appendChild(topbar);

    const progressCard = document.createElement("div");
    progressCard.className = "progress-card";
    progressCard.innerHTML = `
      <div class="progress-track"><i></i></div>
      <div class="progress-count nums"></div>
      <button class="btn-reset" type="button">Сбросить</button>`;
    progressCard.querySelector(".btn-reset").addEventListener("click", () => {
      progress[day.id] = {};
      saveProgress(progress);
      updateDay(day);
      renderHome();
      showToast("Отметки сброшены");
    });
    section.appendChild(progressCard);

    const banner = document.createElement("div");
    banner.className = "banner-done";
    banner.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      День закрыт — все упражнения выполнены`;
    section.appendChild(banner);

    day.supersets.forEach((ss, ssIdx) => {
      const block = document.createElement("div");
      block.className = "superset";
      const head = document.createElement("div");
      head.className = "superset-head";
      head.innerHTML = ss.label
        ? `<span class="superset-label">${ss.label}</span><span class="superset-hint">${ss.hint}</span>`
        : `<span class="superset-hint">${ss.hint}</span>`;
      block.appendChild(head);

      ss.exercises.forEach((ex, exIdx) => {
        const key = `${ssIdx}-${exIdx}`;
        const card = document.createElement("div");
        card.className = "exercise";
        card.dataset.key = key;

        const setsRows = ex.sets.map(s => `
          <tr>
            <td class="n nums">${s.n}</td>
            <td class="w">${s.w}<span style="color:var(--text-muted);font-weight:500;">кг</span></td>
            <td class="r">${s.r}</td>
            <td class="rest">${s.rest}</td>
          </tr>`).join("");

        card.innerHTML = `
          <div class="ex-head">
            <span class="ex-icon">${ICONS[ex.icon] || ""}</span>
            <span class="ex-info">
              <h3>${ex.name}</h3>
              ${ex.note ? `<div class="note">${ex.note}</div>` : ""}
            </span>
            <span class="ex-check" role="checkbox" aria-checked="false" tabindex="0" aria-label="Отметить «${ex.name}» выполненным">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </span>
          </div>
          <table class="sets">
            <thead><tr><th>#</th><th>Вес</th><th>Повт.</th><th>Отдых</th></tr></thead>
            <tbody>${setsRows}</tbody>
          </table>`;

        const checkEl = card.querySelector(".ex-check");
        function toggle(){
          progress[day.id] = progress[day.id] || {};
          const now = !progress[day.id][key];
          progress[day.id][key] = now;
          saveProgress(progress);
          updateDay(day);
          renderHome();
        }
        checkEl.addEventListener("click", toggle);
        checkEl.addEventListener("keydown", e => {
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
        });

        block.appendChild(card);
      });
      section.appendChild(block);
    });

    dayViews.appendChild(section);
    return section;
  }

  const daySections = {};
  DAYS.forEach(day => { daySections[day.id] = buildDaySection(day); });

  function updateDay(day){
    const section = daySections[day.id];
    const p = progress[day.id] || {};
    const total = dayTotal(day);
    let done = 0;
    section.querySelectorAll(".exercise").forEach(card => {
      const key = card.dataset.key;
      const isDone = !!p[key];
      if(isDone) done++;
      card.classList.toggle("done", isDone);
      const check = card.querySelector(".ex-check");
      check.classList.toggle("checked", isDone);
      check.setAttribute("aria-checked", String(isDone));
    });
    const pct = total ? Math.round(done/total*100) : 0;
    section.querySelector(".progress-track > i").style.width = pct + "%";
    section.querySelector(".progress-count").textContent = `${done}/${total}`;
    section.querySelector(".banner-done").classList.toggle("show", total > 0 && done === total);
  }

  DAYS.forEach(updateDay);

  /* ---------------- Navigation ---------------- */
  const home = document.getElementById("home");
  function openDay(id){
    home.style.display = "none";
    Object.values(daySections).forEach(s => s.classList.remove("active"));
    daySections[id].classList.add("active");
    window.scrollTo(0,0);
  }
  function goHome(){
    Object.values(daySections).forEach(s => s.classList.remove("active"));
    home.style.display = "";
    window.scrollTo(0,0);
  }

  /* ---------------- Share ---------------- */
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const url = window.location.href;
    if(navigator.share){
      try{ await navigator.share({ title:"Трёхдневный Сплит", url }); }catch(e){}
    } else {
      try{
        await navigator.clipboard.writeText(url);
        showToast("Ссылка скопирована");
      }catch(e){
        showToast("Скопируйте ссылку из адресной строки");
      }
    }
  });

  renderHome();
})();
</script>
</body>
</html>
